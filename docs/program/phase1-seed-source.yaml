# IronLog Phase-1 Program — authoritative seed source (Wk-1 baselines locked from test-week execution)
# Source of truth for the config-seed reconciliation (docs/superpowers/specs/2026-07-04-config-seed-reconciliation-design.md).
# D1/D2/D4/D5/D6 executed + locked (D6 = Sat 2026-07-05 session).
# Conventions: T1 primaries rep_low=6/rep_high=8. HT = plates + band_config (band-composite live). rpe_cap default 8.
# Shoes: Metcon 9 (flat), Adipower II (heeled), Cloud X4 (Z2, not engine).

shoes:
  metcon_9: "flat — deadlifts/squats/hinges/upright"
  adipower_ii: "heeled — quad-focus/ATG"
  cloud_x4: "cushioned — Z2 (not engine-managed)"

days:
  d1:  # Upper A / Push — shoe: Metcon 9 (no swap)
    T1_STRAIGHT: {group_key: "T1", rest: 120, shoe: "Metcon 9", anchor: true, ex: [
      {m: bench_press, reps: [6,8], rule: rpe_8_standard, load: 165}]}
    T2_GIANT: {group_key: "T2 GS", rest: 90, rounds: 3, shoe: "Metcon 9", ex: [
      {m: pendlay_row_narrow, reps: [6,8], rule: rpe_8_standard, load: 170},
      {m: incline_db_press, reps: [8,12], rule: rpe_8_standard, load: 55},
      {m: face_up_incline_knee_raise_d1, reps: [10,15], rule: incline_reduction, assist_level: 25, assist_ladder: [25,20,15,10,5,0]}]}
    T3_GIANT: {group_key: "T3 GS", rest: 75, rounds: 3, shoe: "Metcon 9", ex: [
      {m: pull_up_d1, reps: [8,12], rule: pull_up_rolling_max},
      {m: cross_body_lateral_raise, reps: [10,15], rule: rpe_8_standard, load: 12.5, unilateral: true},
      {m: lat_prayer, reps: [8,12], rule: rpe_8_standard, load: 60}]}
    T4_GIANT: {group_key: "T4 GS", rest: 60, rounds: 3, shoe: "Metcon 9", ex: [
      {m: seated_cable_row, reps: [8,12], rule: rpe_8_standard, load: 100},
      {m: ab_wheel_rollout, reps: [8,8], rule: rep_ladder},
      {m: cross_body_rear_delt_fly_d1, reps: [10,15], rule: rpe_8_standard, load: 10, unilateral: true}]}

  d2:  # Lower A — shoe: Adipower II (all tiers; corrected 2026-07-14, was mistakenly Metcon 9)
    T1_STRAIGHT: {group_key: "T1", rest: 150, shoe: "Adipower II", anchor: true, ex: [
      {m: belt_squat, reps: [6,8], rule: rep_ladder, load: 260, rep_target: 8, rep_ladder: [8,10,12,15], ceiling: true, meso: {2: back_squat}}]}
    T1b: {group_key: "T1b", rest: 120, shoe: "Adipower II", anchor: true, ex: [
      {m: hip_thrust_d2, reps: [6,8], rule: rule_driven, ht_plates: 205, ht_band_config: [orange]}]}  # peak 250, bottom 223 (<225 clamp). 2026-07-26: rep range widened 8-8 -> 6-8 (standard RPE_8_STANDARD-style rep range; advance still gates only on hitting rep_high=8, per _clean/hit_target)
    T2_GIANT: {group_key: "T2 GS", rest: 90, rounds: 3, shoe: "Adipower II", ex: [
      {m: leg_curl_d2, reps: [8,12], rule: rpe_8_standard},  # 2026-07-22: replaced assisted_nordic_curl_d2; needs-calibration (no prior history). 2026-07-26: renamed to "Lying Leg Curl [GHR]" -- same Hyper Pro rack equipment (id=8) as Belt Squat, zero logged history, safe rename.
      {m: scout_reverse_hyper_bilateral_d2, reps: [8,12], rule: fixed_load, load: 180}]}  # 2026-07-22: corrected from stale rep_ladder to match the live progression_rule fix (movement 19)
    T3_GIANT: {group_key: "T3 GS", rest: 75, rounds: 3, shoe: "Adipower II", ex: [
      {m: atg_split_squat, reps: [8,12], rule: rpe_8_standard, load: 25, unilateral: true},
      {m: cable_tib_raise_d2, reps: [10,15], rule: rpe_8_standard, load: 25},
      {m: reverse_nordic_assisted_d2, reps: [8,12], rule: rpe_8_standard, load: 0}]}  # 2026-07-22: added to restore D2's 3rd knee-modality slot. 2026-07-24: rep range corrected 8-10 -> 8-12; converted from assisted to loaded double-progression (bodyweight start, load once 12 reps clears), both D2 and D5

  d4:  # Upper B / Pull — shoe: Metcon 9 (no swap). T2/T3 swap applied (SA-DB-Row->T2, Andreoni->T3).
    T1_STRAIGHT: {group_key: "T1", rest: 120, shoe: "Metcon 9", anchor: true, ex: [
      {m: standing_ohp_d4, reps: [6,8], rule: rpe_8_standard}]}  # 2026-07-23: closes the program's overhead-press gap. Placed before Pull-up (not after, athlete's original request) -- Movement.is_primary=True lifts must precede all non-primary movements session-wide (validator's PRIMARY_NOT_FIRST), and Pull-up is is_primary=False, so "Pull-up then OHP" is structurally unassemblable regardless of tier naming. Needs-calibration start -- no baseline seeded, no prior history (mirrors the Leg Curl D2 swap's precedent).
    T1b: {group_key: "T1b", rest: 180, shoe: "Metcon 9", anchor: true, ex: [
      {m: pull_up_d4, reps: [6,8], rule: pull_up_rolling_max}]}  # 2-phase; milestone (6->all-unassisted Wk2) MANUAL. Moved from T1 to T1b 2026-07-23 (see T1's OHP note); slot_id stays "d4_t1" (see program_seed.py comment) -- this movement's identity, not the tier label, is what's stable.
    T2_GIANT: {group_key: "T2 GS", rest: 90, rounds: 3, shoe: "Metcon 9", ex: [
      {m: meadows_row_bruno_bar, reps: [8,12], rule: rpe_8_standard, load: 35, unilateral: true, meso: {2: pendlay_row}},
      {m: face_up_incline_knee_raise_d4, reps: [10,15], rule: incline_reduction, assist_level: 10, assist_ladder: [10,5,0]},
      {m: single_arm_db_row, reps: [8,12], rule: rpe_8_standard, load: 40, unilateral: true}]}  # MOVED after Face-Up Knee (athlete request 2026-07-09)
    T3_GIANT: {group_key: "T3 GS", rest: 75, rounds: 3, shoe: "Metcon 9", ex: [
      {m: db_rear_delt_fly, reps: [8,12], rule: rpe_8_standard, load: 10},
      {m: andreoni_bar_cable_pullover, reps: [8,12], rule: rpe_8_standard, load: 70},
      {m: dragon_flag, reps: [3,6], rule: body_position_progression, body_position: tuck, position_ladder: [tuck, single_leg_extended, straddle, full]}]}

  d5:  # Lower B — shoe: Metcon 9 through T1b, SWAP -> Adipower II at T2 (moved from T3
       # 2026-07-17: BSS needs the heel, so the swap must land before BSS, not after)
    T1_STRAIGHT: {group_key: "T1", rest: 180, shoe: "Metcon 9", anchor: true, ex: [
      {m: rdl_d5, reps: [6,8], rule: rpe_8_standard, load: 255, meso: {1: rdl_conventional, 2: rdl_staggered}}]}
    T1b: {group_key: "T1b", rest: 150, shoe: "Metcon 9", anchor: true, ex: [
      {m: hip_thrust_d5, reps: [6,8], rule: rule_driven, ht_plates: 205, ht_band_config: [orange]}]}  # peak 250, bottom 223(accepted, <225 clamp); INDEPENDENT track from d2. 2026-07-26: rep range widened 8-8 -> 6-8, same reasoning as D2
    T2_GIANT: {group_key: "T2 GS", rest: 90, rounds: 3, shoe: "Adipower II", ex: [   # <-- SHOE SWAP
      {m: bulgarian_split_squat, reps: [8,12], rule: rpe_8_standard, load: 30, unilateral: true},
      {m: scout_reverse_hyper_bilateral_d5_90cap, reps: [15,20], rule: rep_ladder, load: 90, rep_target: 15, rep_ladder: [15,18,20,22,25], ceiling: true, meso: 1},  # remapped to Light Reverse Hyper (cap=90); D6's recovery slot got its own new movement instead of sharing this one
      {m: scout_reverse_hyper_single_leg_d5, reps: [12,15], rule: rpe_8_standard, load: 70, unilateral: true, meso: 2},  # SEPARATE movement id (meso rotation = two ids)
      {m: assisted_nordic_curl_d5, reps: [8,12], rule: fixed_load, assist_level: 15}]}  # 2026-07-22: fixed at 15deg, no more progression (athlete's genuine trained level)
    T3_GIANT: {group_key: "T3 GS", rest: 60, rounds: 3, shoe: "Adipower II", ex: [
      {m: poliquin_step_up, reps: [8,12], rule: rpe_8_standard, load: 20, unilateral: true},
      {m: reverse_nordic_assisted, reps: [8,12], rule: rpe_8_standard, load: 0},  # 2026-07-24: rep range corrected 8-10 -> 8-12; converted from assisted to loaded double-progression (bodyweight start, load once 12 reps clears), both D2 and D5
      {m: cable_tib_raise_d5, reps: [10,15], rule: rpe_8_standard, load: 30},  # INDEPENDENT from d2 (25); d5=30
      {m: hyper_pro_calf_raise, reps: [10,15], rule: rpe_8_standard, load: 245}]}

  d6:  # Weak Points — EXECUTED Sat 2026-07-05, loads locked. Z2 (backward 3min@5°@1.5 / forward 12min@5°@3.0) deferred (not engine-managed).
    GS1: {group_key: "GS1", rest: 90, rounds: 3, shoe: "Metcon 9", ex: [
      {m: pull_up_d6, reps: [5,8], rule: pull_up_rolling_max},  # Wk1 Set1 max = 7 (PR), 7/6/6 unassisted; red_band assist
      {m: dips, reps: [8,12], rule: rpe_8_standard, load: 150, load_type: cable},  # CORRECTED: cable-loaded RPE-8 (Andreoni bar + Ares cable), not BW rep-ladder
      {m: hip_thrust_d6, reps: [12,12], rule: rule_driven_fixed_increment, ht_plates: 155, ht_band_config: [orange], derived_from_unified_group: main, derive_ratio: 0.8}]}  # D5x0.80 (~192 target); 155 bar + Orange Shorty Monster = peak 200 / bottom 173 (<225 GMWD cap); Wk1 executed 200 plates-only (misload), Wk2+ banded
    GS2: {group_key: "GS2", rest: 90, rounds: 3, shoe: "Metcon 9", ex: [
      {m: reverse_hyper_recovery, reps: [15,20], rule: fixed_load, load: 90, rpe_cap: 6},  # MOVED from GS3
      {m: db_seal_row, reps: [8,12], rule: rpe_8_standard, load: 30},   # 30/hand
      {m: lateral_raise_ares, reps: [10,15], rule: rpe_8_standard, load: 10}]}
    GS3: {group_key: "GS3", rest: 60, rounds: 3, shoe: "Metcon 9", ex: [
      {m: face_pull, reps: [15,20], rule: rpe_8_standard, load: 30},
      {m: cable_v_bar_pushdown, reps: [8,12], rule: single_session_progression, load: 60},
      {m: t_bar_row_wide_kleva, reps: [8,12], rule: rpe_8_standard, load: 105}]}  # MOVED from GS2
