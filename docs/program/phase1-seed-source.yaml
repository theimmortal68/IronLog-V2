# IronLog Phase-1 Program — authoritative seed source (Wk-1 baselines locked from test-week execution)
# Source of truth for the config-seed reconciliation (docs/superpowers/specs/2026-07-04-config-seed-reconciliation-design.md).
# D1/D2/D4/D5/D6 executed + locked (D6 = Sat 2026-07-05 session).
# Conventions: T1 primaries rep_low=6/rep_high=8. HT = plates + band_config (band-composite live). rpe_cap default 8.
# Shoes: Metcon 9 (flat), Adipower II (heeled), Cloud X4 (Z2, not engine).

shoes:
  metcon_9: "flat — deadlifts/squats/hinges/upright"
  adipower_ii: "heeled — quad-focus/ATG"
  cloud_x4: "cushioned — Z2 (not engine-managed)"

days:
  d1:  # Upper A / Push — shoe: Metcon 9 (no swap)
    T1_STRAIGHT: {group_key: "T1", rest: 120, shoe: "Metcon 9", anchor: true, ex: [
      {m: bench_press, reps: [4,6], rule: rpe_8_standard, load: 155}]}  # 2026-08-10: maintenance block, T1 rep range 6-8 -> 4-6, real Wk1 locked 155x3x6 RPE8 (Belle Mere BMF Camber Bar 21" grip)
    T1b: {group_key: "T1b", rest: 120, shoe: "Metcon 9", anchor: true, ex: [
      {m: pendlay_row_narrow, reps: [4,6], rule: hold_load_strain_constraint, load: 180}]}  # 2026-08-10: held at 170 while strain heals (maps to FIXED_LOAD), rep range 6-8 -> 4-6; 2026-08-25: staged raise -- 180 this week, then manually bump to 185 next week and hold there (still FIXED_LOAD, not auto-progression); live DB MovementState.id=3 updated directly
    T2_GIANT: {group_key: "T2 GS", rest: 90, rounds: 3, shoe: "Metcon 9", ex: [
      # 2026-08-10: full T2 GS turnover -- Lying Tricep Extension / Incline DB
      # Press / Face-Up Incline Knee Raise all drop out of D1 entirely,
      # replaced by real Wk1-executed movements (APEX Config A: Stryker Pad +
      # Matrix Machine).
      {m: stryker_pad_seated_ohp_d1, reps: [8,12], rule: rpe_8_standard, load: 65},  # 2026-08-10: real Wk1 locked 65x3x12 (possibly RPE 6-7, verify Wk2)
      {m: matrix_machine_preacher_curl_d1, reps: [8,12], rule: rpe_8_standard, load: 55},  # 2026-08-10: real Wk1 locked 55x3x12 RPE8, reintroduces bicep work
      {m: better_fly_standing_lateral_raise_d1, reps: [10,15], rule: rpe_8_standard, load: 20}]}  # 2026-08-10: real Wk1 locked 20x3x12 RPE8
    T3_GIANT: {group_key: "T3 GS", rest: 75, rounds: 3, shoe: "Metcon 9", ex: [
      {m: pull_up_d1, reps: [4,6], rule: pull_up_rolling_max},  # 2026-08-10: switched to Wide-Grip dead-hang unassisted (was assisted neutral-grip 3-band ladder), real Wk1 executed 4/4/4
      {m: better_fly_sagittal_lat_pulldown_d1, reps: [8,12], rule: rpe_8_standard},  # 2026-08-13: replaces lat_prayer (Andreoni motion not reproducible on Better Fly) -- new, needs-calibration
      {m: ab_wheel_rollout_d1, reps: [8,12], rule: rep_ladder_at_cap}]}  # 2026-08-10: relocated from the now-removed T4 GS; D1's mandatory core slot (anti-extension), real Wk1 locked 3x8 bodyweight
    # T4 GS removed entirely 2026-08-10: Ab Wheel Rollout moved to T3 above;
    # Seated Cable Row and Cross-Body Rear Delt Fly (its old T4 co-members)
    # both drop out of D1's real Wk1 execution, no replacement.

  d2:  # Lower A — shoe: Adipower II (all tiers; corrected 2026-07-14, was mistakenly Metcon 9)
    # 2026-08-11 (STAB maintenance-block redesign, Task 2): T1 rep range
    # drop 6-8 -> 4-6 (matches every other T1 primary). T1b (Hip Thrust)
    # REMOVED ENTIRELY -- not in the FINAL source doc's D2 session. T2 GS
    # fully turned over to Matrix Machine Sissy Squat / Nordic Curl Max
    # [Ares] (Lying Leg Curl, Scout Reverse Hyper drop out of D2). T3 GS
    # gains Hybrid Board Calf Raise, drops Reverse Nordic Curl; rest 75 -> 60
    # (FINAL doc states 60s explicitly for D2's T3 GS, matches D5's already-
    # correct T3 GS rest). New T4_STRAIGHT tier for D2's mandatory core slot
    # (Ab Trainer Decline Sit-up).
    #
    # 2026-08-19 (athlete directive): T4_STRAIGHT (Ab Trainer Decline
    # Sit-up) removed as a standalone tier and merged into T2_GIANT as a
    # 3rd giant-set member -- same Movement (ab_trainer_decline_situp_d2),
    # same rep target, same rule/assist config, just relocated tier.
    #
    # 2026-08-19 (athlete directive, same day): Ab Trainer Decline Sit-up
    # directly traded T2/T3 giant-set placement with T3_GIANT to deconflict
    # bench-attachment contention (mirrors the D6 Dips/CG-Press direct-trade
    # precedent) -- Ab Trainer now sits in T3_GIANT. First attempt paired
    # this with Hybrid Board Tib Raise [D2] moving the other way into
    # T2_GIANT, but Tib Raise needs the same full-ankle-dorsiflexion flat
    # shoe as ATG Split Squat (2026-08-14 T3 shoe fix) -- T2's heeled
    # Adipower II reintroduced that conflict. Revised same day: Hybrid Board
    # Calf Raise [D2] takes T2_GIANT's 3rd slot instead (far less
    # shoe-sensitive than the TIB pattern), Tib Raise stays in T3_GIANT with
    # the flat shoe it needs.
    T1_STRAIGHT: {group_key: "T1", rest: 150, shoe: "Adipower II", anchor: true, ex: [
      {m: belt_squat, reps: [4,6], rule: rpe_8_standard, load: 260, rep_target: 8, rep_ladder: [8,10,12,15], ceiling: true, meso: {2: back_squat}}]}
    T2_GIANT: {group_key: "T2 GS", rest: 90, rounds: 3, shoe: "Adipower II", ex: [
      {m: matrix_machine_sissy_squat, reps: [8,12], rule: rpe_8_standard},  # 2026-08-11: new, needs-calibration (bodyweight first, add DBs once easy). knee_modality=SISSY on the TierExercise (program_seed.py) -- closes the program's previously-unfilled SISSY weekly target.
      # 2026-08-20 (athlete directive): d2_t2e now rotates A/B automatically
      # via WeekParityRotation -- week "A" = Nordic Curl Max [Apex] (Apex
      # bench attachment, angle-adjustable, unassisted, 4-8 reps), week "B"
      # = Nordic Curl Max [Ares] (flat + 2x Rogue Monster band assist,
      # 8-12 reps). This YAML schema has no representation for a two-
      # movement rotating slot -- the entry below is the base/fallback
      # (Ares, "B") TierExercise config only; the actual A/B wiring lives
      # in program_seed.py's _add_wpr calls, not expressible here.
      {m: nordic_curl_max_d2, reps: [8,12], rule: assistance_reduction, assist_level: 80, assist_ladder: [80,70,60,50,40,30,20,10,0]},  # base/fallback (week "B") config only -- see above note. Ares cable/band assist. knee_modality=NORDIC on the TierExercise -- same Movement row reused by D5/Task 4 (independent day-scoped assist track), each day's TierExercise tags its own knee_modality.
      {m: hybrid_board_calf_raise_d2, reps: [10,15], rule: rpe_8_standard}]}  # 2026-08-19: traded in from T3_GIANT (see above note); config unchanged.
    T3_GIANT: {group_key: "T3 GS", rest: 60, rounds: 3, shoe: "Metcon 9", ex: [
      {m: atg_split_squat, reps: [8,12], rule: rpe_8_standard, load: 25, unilateral: true},
      {m: hybrid_board_tib_raise_d2, reps: [10,15], rule: rpe_8_standard},  # 2026-08-19: moved back here from a same-day T2_GIANT trial (see above note); config unchanged, keeps the flat shoe this movement needs.
      {m: ab_trainer_decline_situp_d2, reps: [10,15], rule: incline_reduction, assist_level: 15, assist_ladder: [0,5,10,15,20,25,30,35,40,45,50,55,60,65,70,75,80,85]}]}  # 2026-08-19: traded in from T2_GIANT (see above note); config unchanged.

  d4:  # Upper B / Pull — shoe: Metcon 9 (no swap).
    # 2026-08-11 (STAB maintenance-block redesign, Task 3): reconciled to
    # docs/program/source/2026-08-10-maintenance-block-seed-data-FINAL.md's
    # real D4 session. T1 rep range 6-8 -> 4-6, Standing OHP [PB] -> Seated
    # BTN OHP [PB] (new, seated/BTN on APEX Bench upright). T1b Wide-Grip
    # Pull-up [TOWER] -> Better Fly Lat Pulldown [FT] (new, athlete
    # directive -- drops D4's direct pull-up work, D1/D6 keep theirs, total
    # program-wide pull-up frequency 3x/week -> 2x/week); slot_id stays
    # "d4_t1" (the one explicitly-allowed reassignment case, per this task's
    # brief). T2 GS fully turned over: Meadows Row [OB + LM] (carried a
    # meso-2 rotation to Pendlay Row -- DROPPED, not carried forward; D5's
    # d5_t2b remains the program's adaptive-slot meso-rotation example),
    # Face-Up Incline Knee Raise, and Single-Arm DB Row [DB] all drop out of
    # D4 entirely, replaced by Stryker Pad CSR Barbell [PB] / Ab Trainer
    # Hanging Leg Raise / Better Fly Cable Pullover [FT] (all three new,
    # needs-calibration). T3 GS: DB Rear Delt Fly [DB] rep range widens
    # 8-12 -> 10-15; Andreoni Cable Pullover drops out of D4 entirely,
    # replaced by Lying Tricep Extension [SB] (REUSED, not new -- see
    # ironlog/seed.py's dated comment on that Movement row; its D1-original
    # slot dropped it in Task 1, unused since); PureTorque Pro Rotation
    # unchanged (already IS the FINAL doc's `cable_woodchopper` entry, same
    # equipment, confirmed by Step 1 verification, no rewiring needed).
    T1_STRAIGHT: {group_key: "T1", rest: 120, shoe: "Metcon 9", anchor: true, ex: [
      {m: seated_btn_ohp_d4, reps: [4,6], rule: rpe_8_standard}]}  # 2026-08-11: new, needs-calibration (zero prior history).
    T1b: {group_key: "T1b", rest: 180, shoe: "Metcon 9", anchor: true, ex: [
      {m: better_fly_lat_pulldown_d4, reps: [6,8], rule: rpe_8_standard}]}  # 2026-08-11: new, needs-calibration. Reuses slot_id "d4_t1" (program_seed.py comment) -- the anchor slot's content changed, not its identity.
    # 2026-08-20 (code/live reconciliation, athlete confirmed live is
    # correct): Ab Trainer Hanging Leg Raise and PureTorque Pro Rotation
    # direct-traded T2/T3 placement at some earlier point this session
    # live-DB-only (an Apex/Stryker Pad equipment-conflict fix, never
    # committed to code -- this closes that gap). PureTorque now sits in
    # T2_GIANT; Ab Trainer Hanging Leg Raise moves to T3_GIANT.
    T2_GIANT: {group_key: "T2 GS", rest: 90, rounds: 3, shoe: "Metcon 9", ex: [
      {m: stryker_pad_csr_barbell_d4, reps: [8,12], rule: rpe_8_standard},  # 2026-08-11: new, needs-calibration
      # 2026-07-26: Dragon Flag replaced by PureTorque Pro Rotation (athlete
      # directive -- "Cable Woodchopper" in the original proposal, this
      # existing library movement IS that rotational core pattern).
      {m: puretorque_pro_rotation_d4, reps: [8,12], rule: rpe_8_standard},  # 2026-08-20: traded in from T3_GIANT (see above note); config unchanged.
      {m: better_fly_cable_pullover_d4, reps: [10,15], rule: rpe_8_standard}]}  # 2026-08-11: new, needs-calibration
    # 2026-08-20 (athlete directive): DB Rear Delt Fly (old d4_t3a) VACATED --
    # replaced by Better Fly Rear Delt Extension [FT] (fresh slot "d4_t3f",
    # never-reassign-slot_id -- genuinely different Movement row, mirrors
    # the D1 Lat Prayer -> Better Fly Sagittal Lat Pulldown precedent).
    # Existing shared Movement row, already wired on D6 (m-id
    # better_fly_rear_delt_ext_d6) -- this is D4's own day-scoped m-id.
    T3_GIANT: {group_key: "T3 GS", rest: 75, rounds: 3, shoe: "Metcon 9", ex: [
      {m: better_fly_rear_delt_ext_d4, reps: [10,15], rule: rpe_8_standard},  # 2026-08-20: new slot, needs-calibration
      {m: lying_tricep_extension_camber7_d4, reps: [8,12], rule: rpe_8_standard},  # 2026-08-11: reused movement (Lying Tricep Extension [SB]), fresh slot "d4_t3e" -- needs-calibration. grip: 7_inch is a physical-setup detail (same BMF Camber Bar family as D1 Bench Press's 21" grip note), not a schema field.
      {m: ab_trainer_hanging_leg_raise_d4, reps: [8,12], rule: incline_reduction, assist_ladder: [0,5,10,15,20,25,30,35,40,45,50,55,60,65,70,75,80,85]}]}  # 2026-08-20: traded in from T2_GIANT (see above note); config unchanged.

  d5:  # Lower B — shoe: Metcon 9 through T1, SWAP -> Adipower II at T2 (moved from T3
       # 2026-07-17: BSS-family needs the heel, so the swap must land before BSS, not after)
    # 2026-08-12 (STAB maintenance-block redesign, Task 4): reconciled to
    # docs/program/source/2026-08-10-maintenance-block-seed-data-FINAL.md's
    # real D5 session. T1 RDL [PB] -> Kickstand RDL [DB] (new, unilateral,
    # rep range 6-8 -> 4-6). T1b (Hip Thrust) REMOVED ENTIRELY -- not in the
    # FINAL source doc's D5 session (2nd of 3 Hip Thrust removals across
    # this redesign). T2 GS fully turned over to Nordic Max Bulgarian Split
    # Squat / Nordic Curl Max [Ares] / Better Fly Kickback (Bulgarian Split
    # Squat [DB], Light/Single-Leg Reverse Hyper, Nordic Curl [GHR] all drop
    # out of D5). T3 GS: Reverse Nordic Curl [GHR] kept unchanged, gains
    # Hybrid Board Calf Raise + Hybrid Board Tib Raise (both new, separate
    # per-day Movement rows, NOT shared with D2's own [D2] rows) + Better
    # Fly Hip Adduction; Poliquin Step-up / Cable Tib Raise / Hyper Pro Calf
    # Raise all drop out. New T4_STRAIGHT tier for D5's mandatory core slot
    # (Ab Trainer Russian Twist). The Hybrid Board Tib Raise addition (both
    # here and on D2) is a plan-owner addendum resolving this task's own
    # NEEDS_CONTEXT round-trip: the FINAL doc's stated 3-item D5 T3 GS would
    # have dropped TIB-modality work program-wide to 1x/week, breaking the
    # "tib must appear on >=2 days" invariant -- this 4th T3 GS member
    # preserves it without relaxing that test.
    T1_STRAIGHT: {group_key: "T1", rest: 180, shoe: "Metcon 9", anchor: true, ex: [
      {m: kickstand_rdl_d5, reps: [4,6], rule: rpe_8_standard, unilateral: true}]}  # 2026-08-12: new, needs-calibration (zero prior history)
    # 2026-08-20 (athlete directive): nordic_curl_max_d5 (d5_t2e) VACATED --
    # D5 no longer has any Nordic Curl slot at all. Replaced by
    # lying_leg_curl_ghr_ares_d5 (fresh slot "d5_t2i", cable lying leg curl,
    # GHR bench + Ares cable stack -- distinct equipment combo from the old,
    # long-unwired D2 "Lying Leg Curl [GHR]"). D2's own Nordic Curl slot
    # (d2_t2e) now carries the program's sole weekly Nordic exposure,
    # rotating A/B via WeekParityRotation (see that YAML section).
    #
    # 2026-08-22 (athlete directive): full T2 GS/T3 GS/T4 restructure into
    # two 4-member giant sets, GS1/GS2 (mirrors D6's GS-numbering
    # convention above). T4 (Ab Trainer Russian Twist) ELIMINATED as its
    # own tier, folded into GS1 (mirrors D6's Dips T1->GS1 fold-in). All
    # members keep their slot_id unchanged, just relocated -- see
    # program_seed.py's _seed_d5 for the full historical audit trail of
    # what used to live in T2 GS/T3 GS/T4.
    GS1: {group_key: "GS1", rest: 60, rounds: 3, shoe: "Metcon 9", ex: [
      {m: lying_leg_curl_ghr_ares_d5, reps: [10,15], rule: rpe_8_standard},
      {m: ab_trainer_russian_twist_d5, reps: [10,15], rule: incline_reduction, assist_ladder: [0,5,10,15,20,25,30,35,40,45]},  # 2026-08-22: capped at 45deg (was 0-85, matching the rest of the Ab Trainer family) -- rotational+loaded movement, athlete directive to switch to weight-based progression past this angle rather than push toward 85. See ironlog/seed.py's Movement comment.
      {m: hybrid_board_tib_raise_d5, reps: [10,15], rule: rpe_8_standard},  # knee_modality=TIB on the TierExercise -- preserves the program's 2x/week TIB invariant
      {m: better_fly_hip_adduction_d5, reps: [10,15], rule: rpe_8_standard, unilateral: true}]}
    GS2: {group_key: "GS2", rest: 90, rounds: 3, shoe: "Adipower II", ex: [   # <-- SHOE SWAP
      {m: matrix_machine_bss_d5, reps: [8,12], rule: rpe_8_standard, unilateral: true},
      {m: reverse_nordic_assisted, reps: [8,12], rule: rpe_8_standard, load: 0},
      {m: hybrid_board_calf_raise_d5, reps: [10,15], rule: rpe_8_standard},
      {m: better_fly_kickback_d5, reps: [10,15], rule: rpe_8_standard, unilateral: true}]}

  d6:  # Weak Points — 2026-08-12 (maintenance block, STAB redesign, Task 5): T1
    # straight tier (Dips) ELIMINATED ENTIRELY -- FINAL doc's D6 has no
    # standalone T1; Dips folds back into GS1. Z2 (backward 3min@5°@1.5 /
    # forward 12min@5°@3.0) deferred (not engine-managed).
    GS1: {group_key: "GS1", rest: 90, rounds: 3, shoe: "Metcon 9", ex: [
      # 2026-08-12 (STAB redesign fix, post-Task-5): pull_up_neutral_paused_d6
      # -> pull_up_d6_wide_grip_assisted, per docs/superpowers/specs/2026-08-10-
      # stab-maintenance-block-redesign-design.md §5 (confirmed-final pull-up
      # architecture -- D6 gets an ASSISTED wide-grip pull-up, sling + single
      # 20lb band, assist_ladder [20,0], not the old unassisted neutral-grip
      # variant). Task 5 initially left this unchanged after confirming the
      # exact movement name had never existed in the repo -- correct check,
      # wrong conclusion; the fix was to CREATE the movement, not skip it.
      {m: pull_up_d6_wide_grip_assisted, reps: [5,8], rule: assistance_reduction, assist_level: 20, assist_ladder: [20, 0]},
      # 2026-08-16 (athlete directive, revised): close_grip_bench_camber_14_d6
      # and dips directly traded GS placement -- Dips + CG Press are both
      # heavy compound presses, rotating them together causes interference.
      # CG Press sits here now; Dips moves to GS2 below.
      # close_grip_bench_camber_14_d6: reuses the existing "Swiss Bar CG
      # Press [SB]" movement (see program_seed.py's PROGRAM_TO_LIBRARY
      # comment) -- needs-calibration, wk1_calibration_estimate 135-145 per
      # the FINAL doc (135 <= 155*0.90=139.5 <= 145).
      {m: close_grip_bench_camber_14_d6, reps: [4,6], rule: rpe_8_standard},
      {m: better_fly_rear_delt_ext_d6, reps: [10,15], rule: rpe_8_standard}]}
    # GS2: FULL turnover -- hip_thrust_d6 (3rd/final Hip Thrust removal this
    # redesign), reverse_hyper_recovery, db_seal_row, lateral_raise_ares all
    # drop out entirely. All three new members are needs-calibration (zero
    # prior history).
    #
    # 2026-08-16 (athlete directive, revised): dips (was GS1) traded places
    # with close_grip_bench_camber_14_d6 -- now paired with Bicep Curl and
    # Stryker Pad CSR Cables (both pull-ish/isolation), no press-press
    # overlap.
    #
    # 2026-08-16 (athlete directive): dips converted back to band assist
    # (2nd flip) -- real stackable-band setup (green 50-120lb, purple
    # 25-80lb, black 10-50lb, combined/swapped mid-session), modeled as a
    # plain CABLE_LB assist value (see ironlog/seed.py's Dips comment).
    # Real Wk1 last-set data (purple alone, 12 reps @ RPE 8.5) seeds
    # assist_level=50 -- not needs-cal.
    #
    # 2026-08-16 (athlete directive, effective next week): better_fly_
    # cable_bicep_curl_d6 replaced by d_handle_cable_bicep_curl_d6 -- the
    # Better Fly cuff doesn't work well for curls, athlete switched to
    # D-handles mid-session.
    # 2026-08-23 (athlete directive): reverted back to
    # better_fly_cable_bicep_curl_d6 -- fresh slot "d6_g2h"
    # (never-reassign-slot_id, d6_g2g/D-Handle VACATED in turn).
    GS2: {group_key: "GS2", rest: 90, rounds: 3, shoe: "Metcon 9", ex: [
      {m: better_fly_cable_bicep_curl_d6, reps: [10,15], rule: rpe_8_standard},
      {m: stryker_pad_csr_cables_d6, reps: [8,12], rule: rpe_8_standard},
      {m: dips, reps: [8,12], rule: assistance_reduction}]}
    # GS3: Face Pull retained (rep range corrected 15-20 -> 10-15 per the
    # FINAL doc). cable_v_bar_pushdown and t_bar_row_wide_kleva drop out
    # entirely, replaced by two new needs-calibration movements.
    GS3: {group_key: "GS3", rest: 60, rounds: 3, shoe: "Metcon 9", ex: [
      {m: face_pull, reps: [10,15], rule: rpe_8_standard, load: 30},
      {m: better_fly_oh_tricep_ext_d6, reps: [8,12], rule: rpe_8_standard},
      {m: abmat_ab_bench_pad_cable_crunch_d6, reps: [10,15], rule: rpe_8_standard},
      {m: seated_leg_extension_d6, reps: [10,15], rule: rpe_8_standard}]}
